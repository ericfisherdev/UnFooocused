[project]
name = "unfooocused"
version = "0.1.0"
description = "Standalone web UI for Stable Diffusion XL image generation"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "Pillow>=10.0",
    "safetensors>=0.4",
    "websockets>=13.0",
    "torch>=2.1",
    "einops>=0.7",
    "transformers>=4.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "bandit>=1.8",
    "pre-commit>=4.0",

]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modules*", "ui*", "ldm_patched*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["modules", "ui", "tests"]
exclude = ["ldm_patched/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert usage is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", "ldm_patched"]
skips = ["B101"]
